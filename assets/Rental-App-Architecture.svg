<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Rental Management Web App architecture</title><desc id="desc">Customer and owner browsers communicate with the Cloudflare app and API. The backend uses Supabase authentication, database and private storage, with optional mapping and verification services.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#2778ab"/></marker></defs>
<rect width="1200" height="640" rx="16" fill="#fff"/><rect x="12" y="12" width="1176" height="616" rx="14" fill="none" stroke="#2778ab" stroke-width="2"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#1d4e70"><text x="600" y="68" font-size="30" font-weight="bold">Rental Management Web App</text><text x="600" y="102" font-size="17" fill="#526575">A shared online workspace for one rental business</text></g>
<g fill="#f4fafe" stroke="#60b9db" stroke-width="2"><rect x="55" y="255" width="260" height="150" rx="12"/><rect x="470" y="255" width="260" height="150" rx="12"/><rect x="885" y="255" width="260" height="150" rx="12"/><rect x="470" y="465" width="260" height="108" rx="12"/></g>
<g fill="none" stroke="#2778ab" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M326 330H459"/><path d="M741 330H874"/><path d="M600 416V454"/></g>
<g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#1d4e70" font-size="22" font-weight="bold"><text x="185" y="298">Browser</text><text x="600" y="298">Cloudflare</text><text x="1015" y="298">Supabase</text><text x="600" y="502" font-size="19">Supporting services</text></g><g fill="#526575" font-size="17"><text x="185" y="333">Customers / Owners / Admins</text><text x="185" y="364">React + TypeScript interface</text><text x="600" y="333">App hosting + backend API</text><text x="600" y="364">Processes rental operations</text><text x="1015" y="333">Authentication + database</text><text x="1015" y="364">Private photo storage</text><text x="600" y="532">Verification + optional maps</text><text x="600" y="554">Routing / location search</text></g><g fill="#2778ab" font-size="15"><text x="392" y="308">Requests / results</text><text x="808" y="308">Data / results</text></g><text x="600" y="179" font-size="18" fill="#526575">Customers submit requests; invited owners manage confirmed rental operations.</text><text x="600" y="607" font-size="15" fill="#526575">Online business operations require a backend. The fictional browser-local demo is separate.</text></g></svg>
